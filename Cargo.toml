[package]
name = "pattern-native"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "KHR_texture_transform"] }
zip = { version = "9.7.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
png = "0.18"
jpeg-decoder = { version = "0.3.2", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ufbx = "0.11.5"

[target.'cfg(any(unix, windows))'.dependencies]
libc = "0.2"
